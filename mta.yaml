_schema-version: 3.3.0
ID: capbuild
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: capbuild-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      memory: 512M
      disk-quota: 1024M
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: capbuild-auth
      - name: capbuild-connectivity
      - name: capbuild-destination

resources:
  - name: capbuild-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: capbuild-${org}-${space}
        tenant-mode: dedicated
  - name: capbuild-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
  - name: capbuild-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
